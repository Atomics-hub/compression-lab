<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="360" viewBox="0 0 1080 360" role="img" aria-labelledby="title desc">
<title id="title">JLS2 cold-process decode before and after lazy imports</title>
<desc id="desc">Baseline and lazy-loading median decode throughput for the CLI and benchmark worker. The lazy candidate remains below the frozen 250 megabyte per second target and is rejected.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;fill:#24292f}.title{font-size:22px;font-weight:500}.subtitle,.axis,.note{font-size:13px;fill:#57606a}.label,.value{font-size:15px}.grid{stroke:#d0d7de;stroke-width:1}.target{stroke:#cf222e;stroke-width:2;stroke-dasharray:6 5}.baseline{fill:#8c959f}.candidate{fill:#bf8700}.minimum{fill:#24292f}
@media(prefers-color-scheme:dark){text{fill:#f0f6fc}.subtitle,.axis,.note{fill:#8c959f}.grid{stroke:#30363d}.target{stroke:#f85149}.baseline{fill:#6e7681}.candidate{fill:#d29922}.minimum{fill:#f0f6fc}}
</style>
<text class="title" x="22" y="30">Lazy loading helps, but the 250 MB/s gate stays open</text>
<text class="subtitle" x="22" y="54">Fresh processes · 7 rounds × 3 CLUE-LDS development ranges · parent wall clock</text>
<text class="subtitle" x="22" y="76">Bars = median aggregate throughput · dots = minimum round · higher is better</text>
<line class="grid" x1="210.0" y1="108" x2="210.0" y2="300"/>
<text class="axis" x="210.0" y="324" text-anchor="middle">0</text>
<line class="grid" x1="330.0" y1="108" x2="330.0" y2="300"/>
<text class="axis" x="330.0" y="324" text-anchor="middle">50</text>
<line class="grid" x1="450.0" y1="108" x2="450.0" y2="300"/>
<text class="axis" x="450.0" y="324" text-anchor="middle">100</text>
<line class="grid" x1="570.0" y1="108" x2="570.0" y2="300"/>
<text class="axis" x="570.0" y="324" text-anchor="middle">150</text>
<line class="grid" x1="690.0" y1="108" x2="690.0" y2="300"/>
<text class="axis" x="690.0" y="324" text-anchor="middle">200</text>
<line class="grid" x1="810.0" y1="108" x2="810.0" y2="300"/>
<text class="axis" x="810.0" y="324" text-anchor="middle">250</text>
<line class="grid" x1="930.0" y1="108" x2="930.0" y2="300"/>
<text class="axis" x="930.0" y="324" text-anchor="middle">300</text>
<line class="target" x1="810.0" y1="100" x2="810.0" y2="300"/>
<text class="axis" x="810.0" y="94" text-anchor="middle">frozen target</text>
<text class="label" x="22" y="134">CLI baseline</text>
<rect class="baseline" x="210" y="116" width="530.8" height="24" rx="3"/>
<circle class="minimum" cx="642.3" cy="128" r="4"/>
<text class="value" x="749.8" y="134">221.2</text>
<text class="label" x="22" y="182">CLI lazy</text>
<rect class="candidate" x="210" y="164" width="592.7" height="24" rx="3"/>
<circle class="minimum" cx="561.4" cy="176" r="4"/>
<text class="value" x="811.7" y="182">247.0</text>
<text class="label" x="22" y="230">Worker baseline</text>
<rect class="baseline" x="210" y="212" width="584.2" height="24" rx="3"/>
<circle class="minimum" cx="744.7" cy="224" r="4"/>
<text class="value" x="803.2" y="230">243.4</text>
<text class="label" x="22" y="278">Worker lazy</text>
<rect class="candidate" x="210" y="260" width="577.9" height="24" rx="3"/>
<circle class="minimum" cx="541.5" cy="272" r="4"/>
<text class="value" x="796.9" y="278">240.8</text>
<text class="note" x="22" y="342">96/96 exact · frames unchanged · candidate rejected · standards census unchanged</text>
</svg>
