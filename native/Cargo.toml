[package]
name = "compression-lab-native"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[[bin]]
name = "clab-jls2"
path = "src/bin/clab-jls2.rs"

[[bin]]
name = "clab-jls2-a3-audit"
path = "src/bin/clab-jls2-a3-audit.rs"
required-features = ["jls2-a3-audit"]

[features]
default = []
jls2-a3-audit = []

[dependencies]
sha2 = "0.11.0"
zstd = "0.13.3"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
