name: Build release artifacts

on:
  workflow_call:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build
      - run: python -m build --sdist
      - name: Install and exercise the source distribution
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/sdist-venv"
          "$RUNNER_TEMP/sdist-venv/bin/python" -m pip install dist/*.tar.gz
          "$RUNNER_TEMP/sdist-venv/bin/python" -c "import compresslab; data=b'sdist-smoke'*10000; assert compresslab.decompress(compresslab.compress(data)) == data"
      - uses: actions/upload-artifact@v7
        with:
          name: release-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  wheels:
    name: Wheel / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Register arm64 emulation
        if: matrix.os == 'ubuntu-latest'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install cibuildwheel==3.4.1
      - run: python -m cibuildwheel --output-dir wheelhouse
      - uses: actions/upload-artifact@v7
        with:
          name: release-wheels-${{ runner.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  standalone:
    name: Standalone JLS2 decoder / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    steps:
      - uses: actions/checkout@v7
      # Split so each command is its own step: on Windows the default shell is
      # pwsh, whose run: | blocks only propagate the LAST command's exit code, so
      # a build failure would be masked by a passing test. One command per step
      # makes each exit code fail the job. (No --skip needed here: --bin
      # clab-jls2 does not include the clab-s0-kernel tests.)
      - name: Build self-contained decoder
        run: cargo build --release --locked --manifest-path native/Cargo.toml --bin clab-jls2
      - name: Test self-contained decoder
        run: cargo test --release --locked --manifest-path native/Cargo.toml --bin clab-jls2
      - name: Assemble Unix archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bundle="$RUNNER_TEMP/clab-jls2"
          mkdir -p "$bundle" standalone
          cp native/target/release/clab-jls2 "$bundle/"
          cp LICENSE README.md "$bundle/"
          native/target/release/clab-jls2 --version
          tar -czf "standalone/clab-jls2-${RUNNER_OS}-${RUNNER_ARCH}.tar.gz" -C "$RUNNER_TEMP" clab-jls2
      - name: Assemble Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # pwsh run: | blocks otherwise only propagate the last command's exit
          # code; make cmdlet errors terminating and check the native exit code
          # explicitly so any step here fails the job.
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP/clab-jls2", "standalone"
          Copy-Item "native/target/release/clab-jls2.exe", "LICENSE", "README.md" -Destination "$env:RUNNER_TEMP/clab-jls2"
          & "native/target/release/clab-jls2.exe" --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path "$env:RUNNER_TEMP/clab-jls2" -DestinationPath "standalone/clab-jls2-$env:RUNNER_OS-$env:RUNNER_ARCH.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: release-standalone-${{ runner.os }}
          path: standalone/*
          if-no-files-found: error

  verify:
    name: Verify complete release set
    needs: [sdist, wheels, standalone]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: "release-*"
          path: incoming
      - name: Separate Python and standalone distributions
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil

          Path("dist").mkdir()
          Path("standalone").mkdir()
          for artifact in Path("incoming").iterdir():
              destination = (
                  Path("standalone")
                  if artifact.name.startswith("release-standalone-")
                  else Path("dist")
              )
              for source in artifact.iterdir():
                  shutil.copy2(source, destination / source.name)
          PY
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade twine
      - run: python -m twine check dist/*
      - name: Require the complete platform artifact set
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          files = [path.name for path in Path("dist").iterdir() if path.is_file()]
          sdists = [name for name in files if name.endswith(".tar.gz")]
          wheels = [name for name in files if name.endswith(".whl")]
          assert len(sdists) == 1, f"expected one sdist, found {sdists}"
          assert len(wheels) == 5, f"expected five wheels, found {wheels}"
          required_wheels = (
              ("Linux x86_64", ("manylinux", "x86_64.whl")),
              ("Linux aarch64", ("manylinux", "aarch64.whl")),
              ("macOS x86_64", ("macosx_", "x86_64.whl")),
              ("macOS arm64", ("macosx_11_0_arm64.whl",)),
              ("Windows AMD64", ("win_amd64.whl",)),
          )
          for label, markers in required_wheels:
              assert any(all(marker in name for marker in markers) for name in wheels), (
                  f"missing {label} wheel: {wheels}"
              )
          standalone = sorted(
              path.name
              for path in Path("standalone").glob("*")
              if path.is_file()
          )
          required_standalone = (
              ("Linux", ".tar.gz"),
              ("macOS", ".tar.gz"),
              ("Windows", ".zip"),
          )
          assert len(standalone) == 3, f"expected three standalone archives: {standalone}"
          for system, suffix in required_standalone:
              assert any(system in name and name.endswith(suffix) for name in standalone), (
                  f"missing {system} standalone decoder: {standalone}"
              )
          PY
      - name: Seal all release artifacts
        run: |
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          paths = sorted(
              [path for path in Path("dist").iterdir() if path.is_file()]
              + [path for path in Path("standalone").iterdir() if path.is_file()],
              key=lambda path: str(path),
          )
          with Path("SHA256SUMS").open("w", encoding="utf-8") as output:
              for path in paths:
                  output.write(f"{sha256(path.read_bytes()).hexdigest()}  {path}\n")
          PY
          cat SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: verified-release-artifacts
          path: |
            dist/*
            standalone/*
            SHA256SUMS
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/compression-lab/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: verified-release-artifacts
          path: release
      - name: Require explicit environment approval before public upload
        run: mkdir dist && cp release/dist/* dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-github:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: verified-release-artifacts
          path: release
      - name: Publish verified packages and standalone decoders
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          release/dist/*
          release/standalone/*
          release/SHA256SUMS
          --verify-tag
          --generate-notes
