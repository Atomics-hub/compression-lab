name: Controlling release benchmark

on:
  workflow_dispatch:
  push:
    branches:
      - agent/native-baseline-milestone
    paths:
      - .github/workflows/isolated-decision.yml

permissions:
  contents: read

concurrency:
  group: isolated-compression-decision
  cancel-in-progress: false

jobs:
  decision:
    name: Frozen adaptive-v3 market comparison
    runs-on: macos-15
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out candidate
        uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Capture runner provenance
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/compression-lab-evidence"
          mkdir -p "$evidence_dir"
          {
            sw_vers
            uname -a
            sysctl -n hw.logicalcpu
            python3 --version
            rustc --version
            git rev-parse HEAD
            git status --porcelain
          } | tee "$evidence_dir/runner-provenance.txt"

      - name: Install native baselines
        run: scripts/bootstrap-macos-baselines.sh

      - name: Install release package and test tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Validate benchmark implementation
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q src tests scripts/wait-for-quiet-host.py
          scripts/build-native.sh
          python -W error::ResourceWarning -m unittest discover -s tests -v
          cargo test --manifest-path native/Cargo.toml --release --locked
          bash -n scripts/run-release-benchmark.sh

      - name: Run frozen public comparison
        id: benchmark
        shell: bash
        run: |
          set +e
          evidence_dir="$RUNNER_TEMP/compression-lab-evidence"
          scripts/run-release-benchmark.sh runs/release-benchmark-v0.1.0 2>&1 | tee "$evidence_dir/benchmark.log"
          status=${PIPESTATUS[0]}
          if [[ -d runs/release-benchmark-v0.1.0 ]]; then
            cp -R runs/release-benchmark-v0.1.0 "$evidence_dir/"
          fi
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish decision summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Controlling adaptive-v3 release benchmark"
            echo
            echo "Benchmark exit code: ${{ steps.benchmark.outputs.exit_code }}"
            echo
            if [[ -f runs/release-benchmark-v0.1.0/report.md ]]; then
              cat runs/release-benchmark-v0.1.0/report.md
            else
              echo "The benchmark did not produce a report. See benchmark.log in the artifact."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload complete evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: controlling-release-benchmark-${{ github.run_id }}
          path: ${{ runner.temp }}/compression-lab-evidence
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce release-evidence verification
        if: always()
        shell: bash
        run: |
          status="${{ steps.benchmark.outputs.exit_code }}"
          if [[ -z "$status" ]]; then
            echo "Benchmark step did not report an exit code" >&2
            exit 1
          fi
          exit "$status"
