name: JLS2 standalone native decoder gate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jls2-native-decoder-${{ github.ref }}
  cancel-in-progress: false

jobs:
  development-gate:
    name: Frozen CLUE-LDS standalone decode gate
    runs-on: macos-15
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: src
      BASELINE_COMMIT: 604271cbc89a11c739848f68a7739ed523fb9a1b

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install candidate and verification tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Verify implementation and frozen runner
        run: |
          cargo fmt --manifest-path native/Cargo.toml --all -- --check
          cargo clippy --manifest-path native/Cargo.toml --all-targets --locked -- -D warnings
          cargo test --manifest-path native/Cargo.toml --release --locked
          python -m unittest tests.test_jls2_native_decoder tests.test_jls2_native_decoder_benchmark -v
          ruff check scripts/benchmark-jls2-native-decoder.py tests/test_jls2_native_decoder.py

      - name: Fetch byte-exact licensed development ranges only
        run: |
          python scripts/fetch-clue-json-corpus.py \
            --split development \
            --output "$RUNNER_TEMP/clue-development" \
            --cache "$RUNNER_TEMP/clue-cache"

      - name: Build candidate and pinned baseline
        run: |
          cargo build --release --locked --manifest-path native/Cargo.toml --bin clab-jls2
          git worktree add --detach "$RUNNER_TEMP/baseline" "$BASELINE_COMMIT"
          cargo build --release --locked --manifest-path "$RUNNER_TEMP/baseline/native/Cargo.toml"

      - name: Capture provenance
        run: |
          mkdir -p "$RUNNER_TEMP/jls2-native-evidence"
          {
            sw_vers
            uname -a
            sysctl -n hw.logicalcpu
            python --version
            rustc --version
            git rev-parse HEAD
            otool -L native/target/release/clab-jls2
          } | tee "$RUNNER_TEMP/jls2-native-evidence/provenance.txt"

      - name: Run frozen paired gate
        id: benchmark
        shell: bash
        run: |
          set +e
          python scripts/benchmark-jls2-native-decoder.py \
            --corpus "$RUNNER_TEMP/clue-development" \
            --fixtures "$RUNNER_TEMP/jls2-fixtures" \
            --prepare-fixtures \
            --baseline-root "$RUNNER_TEMP/baseline" \
            --native-binary native/target/release/clab-jls2 \
            --output "$RUNNER_TEMP/jls2-native-evidence/results.json" \
            --rounds 7 2>&1 | tee "$RUNNER_TEMP/jls2-native-evidence/benchmark.log"
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish job summary
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/jls2-native-evidence/results.json" ]]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import os
          from pathlib import Path

          result = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "jls2-native-evidence/results.json").read_text()
          )
          summary = result["summary"]
          print("## JLS2 standalone native decoder development gate")
          print()
          print(f"Performance gates passed: **{summary['candidate_qualifies_performance']}**")
          print()
          for row in summary["variants"]:
              print(
                  f"- {row['variant']}: {row['median_aggregate_parent_mbps']:.2f} MB/s "
                  f"median, {row['minimum_aggregate_parent_mbps']:.2f} MB/s minimum"
              )
          print()
          print("Claim ceiling: development-only; public-validation ranges remained unopened.")
          PY
          fi

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: jls2-native-decoder-${{ github.run_id }}
          path: ${{ runner.temp }}/jls2-native-evidence
          if-no-files-found: error
          retention-days: 30

      - name: Enforce frozen performance result
        if: always()
        run: |
          status="${{ steps.benchmark.outputs.exit_code }}"
          test -n "$status"
          exit "$status"
