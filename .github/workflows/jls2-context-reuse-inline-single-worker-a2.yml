name: JLS2 A2 reusable contexts plus inline single worker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jls2-context-reuse-inline-single-worker-a2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux-a2-ab:
    name: Frozen Linux A1 versus inline-single-worker A2
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: src
      BASELINE_COMMIT: 131547f35747cc0ff9dedbdef66d8a9516a7464f
      EVIDENCE_DIR: jls2-context-reuse-inline-single-worker-a2

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install A2 candidate and verification tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Enforce exact A1 ancestry and isolated product diff
        shell: bash
        run: |
          git merge-base --is-ancestor "$BASELINE_COMMIT" HEAD
          product_changes="$(
            git diff --name-only "$BASELINE_COMMIT"..HEAD -- \
              native src config pyproject.toml setup.py
          )"
          test "$product_changes" = "native/src/jls2.rs"
          git diff --check "$BASELINE_COMMIT"..HEAD

      - name: Verify frozen A2 runner and decoder behavior
        run: |
          cargo fmt --manifest-path native/Cargo.toml --all -- --check
          cargo clippy --manifest-path native/Cargo.toml --all-targets --locked -- -D warnings
          cargo test --manifest-path native/Cargo.toml --release --locked
          python -m unittest \
            tests.test_jls2_native_decoder \
            tests.test_jls2_context_reuse_benchmark \
            tests.test_jls2_context_reuse_inline_single_worker_a2_benchmark \
            -v
          ruff check \
            scripts/benchmark-jls2-context-reuse.py \
            scripts/benchmark-jls2-context-reuse-inline-single-worker-a2.py \
            tests/test_jls2_context_reuse_benchmark.py \
            tests/test_jls2_context_reuse_inline_single_worker_a2_benchmark.py

      - name: Fetch licensed development ranges only
        run: |
          python scripts/fetch-clue-json-corpus.py \
            --split development \
            --output "$RUNNER_TEMP/clue-development" \
            --cache "$RUNNER_TEMP/clue-cache"

      - name: Build A2 candidate and exact A1 baseline
        run: |
          cargo build --release --locked --manifest-path native/Cargo.toml --bin clab-jls2
          git worktree add --detach "$RUNNER_TEMP/a1-baseline" "$BASELINE_COMMIT"
          test "$(git -C "$RUNNER_TEMP/a1-baseline" rev-parse HEAD)" = "$BASELINE_COMMIT"
          cargo build --release --locked \
            --manifest-path "$RUNNER_TEMP/a1-baseline/native/Cargo.toml" \
            --bin clab-jls2

      - name: Run frozen A1 versus A2 paired gate
        id: benchmark
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/$EVIDENCE_DIR"
          set +e
          python scripts/benchmark-jls2-context-reuse-inline-single-worker-a2.py \
            --corpus "$RUNNER_TEMP/clue-development" \
            --baseline-binary "$RUNNER_TEMP/a1-baseline/native/target/release/clab-jls2" \
            --candidate-binary native/target/release/clab-jls2 \
            --output "$RUNNER_TEMP/$EVIDENCE_DIR/results.json" \
            --rounds 7 2>&1 | tee "$RUNNER_TEMP/$EVIDENCE_DIR/benchmark.log"
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Capture A2 provenance
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/$EVIDENCE_DIR"
          {
            echo "experiment=jls2-context-reuse-inline-single-worker-a2"
            echo "baseline_commit=$BASELINE_COMMIT"
            echo "candidate_commit=$(git rev-parse HEAD)"
            uname -a
            lscpu
            free -b
            python --version
            rustc --version
            cargo --version
            sha256sum scripts/benchmark-jls2-context-reuse.py
            sha256sum scripts/benchmark-jls2-native-decoder.py
            sha256sum config/clue-json-log-corpus-v1.json
            sha256sum scripts/benchmark-jls2-context-reuse-inline-single-worker-a2.py
            sha256sum native/target/release/clab-jls2
            sha256sum "$RUNNER_TEMP/a1-baseline/native/target/release/clab-jls2"
            git diff --stat "$BASELINE_COMMIT"..HEAD
            git diff "$BASELINE_COMMIT"..HEAD -- native/src/jls2.rs
          } > "$RUNNER_TEMP/$EVIDENCE_DIR/provenance.txt"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: jls2-context-reuse-inline-single-worker-a2-${{ github.run_id }}
          path: ${{ runner.temp }}/jls2-context-reuse-inline-single-worker-a2
          if-no-files-found: error
          retention-days: 30

      - name: Enforce frozen A2 result
        if: always()
        run: |
          status="${{ steps.benchmark.outputs.exit_code }}"
          test -n "$status"
          exit "$status"
