name: JLS2 one-time public validation

on:
  push:
    branches:
      - agent/jls2-public-validation
    paths:
      - .github/workflows/jls2-public-validation.yml
      - config/jls2-public-validation-gates.json
      - config/pbc-public-validation-gates.json
      - config/logtrie-json-log-validation-v1.json
      - docs/benchmarks/2026-07-16-jls2-public-validation-protocol.md
      - scripts/benchmark-jls2-public-validation.py
      - scripts/benchmark-pbc-competitor.py
      - scripts/evaluate-jls2-public-validation.py
      - scripts/fetch-log-corpus.py
      - scripts/wait-for-quiet-host.py
      - tests/test_jls2_public_validation.py
      - tests/test_json_columnar.py
      - tests/test_json_log_codec.py
      - src/compresslab/experimental.py
      - src/compresslab/json_columnar.py
      - src/compresslab/json_log_codec.py
      - src/compresslab/native.py
      - native/Cargo.lock
      - native/Cargo.toml
      - native/src/lib.rs

permissions:
  contents: read

concurrency:
  group: jls2-public-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    # The first valid score is canonical and may not be rerun. Retaining the
    # workflow preserves the exact executable protocol while this guard keeps
    # later branch pushes from reopening the consumed validation split.
    if: github.run_id == '29542804015'
    name: Frozen first-score validation
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    env:
      PYTHONUNBUFFERED: "1"
      CANDIDATE_COMMIT: 6fbb672fb2d7fbb116b58bcf83418a8cce5f227d
      PBC_COMMIT: bac1f86d29624cb585bb4475235d22a28e60ffea
      ACI_JOB_NAME: github-actions

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Initialize evidence directory
        shell: bash
        run: |
          set -euo pipefail
          echo "EVIDENCE_DIR=$RUNNER_TEMP/compression-lab-validation-evidence" >> "$GITHUB_ENV"
          echo "PBC_DIR=$RUNNER_TEMP/pbc" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/compression-lab-validation-evidence"

      - name: Verify the frozen candidate before opening validation
        shell: bash
        run: |
          set -euo pipefail
          test "$(python -c "import json; print(json.load(open('config/jls2-public-validation-gates.json'))['candidate']['frozen_base_commit'])")" = "$CANDIDATE_COMMIT"
          git cat-file -e "$CANDIDATE_COMMIT^{commit}"
          git diff --exit-code "$CANDIDATE_COMMIT" -- \
            src/compresslab/experimental.py \
            src/compresslab/json_columnar.py \
            src/compresslab/json_log_codec.py \
            src/compresslab/native.py \
            native/Cargo.lock \
            native/Cargo.toml \
            native/src/lib.rs
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Install codec and PBC build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            clang \
            lldb \
            llvm-dev \
            lld \
            libboost-all-dev \
            brotli \
            libzstd-dev
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Clone the pinned official PBC artifact
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/antgroup/pbc "$PBC_DIR"
          git -C "$PBC_DIR" checkout --detach "$PBC_COMMIT"
          test "$(git -C "$PBC_DIR" rev-parse HEAD)" = "$PBC_COMMIT"
          test -z "$(git -C "$PBC_DIR" status --porcelain --untracked-files=no)"
          test "$(sha256sum "$PBC_DIR/LICENSE" | cut -d' ' -f1)" = \
            "bacacee63139034e9acba4de0c513eeb93cc6277ae52054a30eebf4be644e7ed"

      - name: Capture runner and source provenance
        shell: bash
        run: |
          set -euo pipefail
          {
            lsb_release -a
            uname -a
            nproc
            lscpu
            python --version
            python -c "from compresslab.native import native_available, zstd_engine; print(f'native_available={native_available()}'); print(f'zstd_engine={zstd_engine()}')"
            brotli --version
            rustc --version
            cargo --version
            clang --version
            cmake --version
            git rev-parse HEAD
            git status --porcelain
            git -C "$PBC_DIR" remote -v
            git -C "$PBC_DIR" rev-parse HEAD
            git -C "$PBC_DIR" status --porcelain --untracked-files=no
            sha256sum "$PBC_DIR/LICENSE"
          } | tee "$EVIDENCE_DIR/runner-provenance.txt"

      - name: Build the official PBC release artifact
        shell: bash
        run: |
          set -euo pipefail
          sed -i \
            's#https://boostorg.jfrog.io/artifactory/main/release/1.67.0/source/boost_1_67_0.tar.gz#https://archives.boost.io/release/1.67.0/source/boost_1_67_0.tar.gz#' \
            "$PBC_DIR/third-party/externals/boost.cmake"
          sed -i \
            's#https://github.com/adrian-thurston/colm/archive/refs/tags/0.14.7.tar.gz#https://codeload.github.com/adrian-thurston/colm-suite/tar.gz/e88bda068d4a25f2afa7f48821e0f539405c8c6a#' \
            "$PBC_DIR/third-party/externals/colm.cmake"
          sed -i \
            's#URL_HASH MD5=213a9ddf207c5732f04941852ca8db62#URL_HASH SHA256=6f11b349722797165f5b71bac5dd71a2ade3cff1c45a9c0ae5522f0f71902ee1#' \
            "$PBC_DIR/third-party/externals/colm.cmake"
          grep -F \
            'https://archives.boost.io/release/1.67.0/source/boost_1_67_0.tar.gz' \
            "$PBC_DIR/third-party/externals/boost.cmake"
          grep -F \
            'https://codeload.github.com/adrian-thurston/colm-suite/tar.gz/e88bda068d4a25f2afa7f48821e0f539405c8c6a' \
            "$PBC_DIR/third-party/externals/colm.cmake"
          grep -F \
            'URL_HASH SHA256=6f11b349722797165f5b71bac5dd71a2ade3cff1c45a9c0ae5522f0f71902ee1' \
            "$PBC_DIR/third-party/externals/colm.cmake"
          git -C "$PBC_DIR" diff --check
          git -C "$PBC_DIR" diff -- \
            third-party/externals/boost.cmake \
            third-party/externals/colm.cmake | \
            tee "$EVIDENCE_DIR/pbc-build-dependency-repair.patch"
          export PBC_MAKE_JOBS="$(nproc)"
          (
            cd "$PBC_DIR"
            bash ./build.sh -r
          ) 2>&1 | tee "$EVIDENCE_DIR/pbc-build.log"
          md5sum \
            "$PBC_DIR/third-party/downloads/boost_1_67_0.tar.gz" | \
            tee "$EVIDENCE_DIR/boost-1.67.0-digest.txt"
          find "$PBC_DIR/third-party/downloads" -maxdepth 1 -type f \
            -exec sha256sum {} + | sort | \
            tee "$EVIDENCE_DIR/pbc-third-party-downloads-sha256.txt"
          git -C "$PBC_DIR" checkout -- \
            third-party/externals/boost.cmake \
            third-party/externals/colm.cmake
          test -z "$(git -C "$PBC_DIR" status --porcelain --untracked-files=no)"

      - name: Run official PBC unit and integration tests
        shell: bash
        run: |
          set -euo pipefail
          capture_pbc_testresult() {
            if [[ -d "$PBC_DIR/testresult" ]]; then
              cp -a "$PBC_DIR/testresult" "$EVIDENCE_DIR/pbc-testresult"
            fi
          }
          trap capture_pbc_testresult EXIT
          integration_dir="$PBC_DIR/testresult/integration_test"
          mkdir -p "$integration_dir"
          touch \
            "$integration_dir/test_data_2000_100_pbc_only_compress" \
            "$integration_dir/test_data_2000_100_pbc_only_decompress" \
            "$integration_dir/test_data_2000_100_pbc_only_decompress2"
          chmod 600 \
            "$integration_dir/test_data_2000_100_pbc_only_compress" \
            "$integration_dir/test_data_2000_100_pbc_only_decompress" \
            "$integration_dir/test_data_2000_100_pbc_only_decompress2"
          bash "$PBC_DIR/run_tests.sh" --pbc-integration-test 2>&1 | \
            tee "$EVIDENCE_DIR/pbc-tests.log"

      - name: Verify validation harnesses
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q src tests scripts
          ruff check \
            scripts/benchmark-jls2-public-validation.py \
            scripts/benchmark-pbc-competitor.py \
            scripts/evaluate-jls2-public-validation.py \
            tests/test_jls2_public_validation.py
          python -W error::ResourceWarning -m unittest \
            tests.test_jls2_public_validation \
            tests.test_json_log_codec \
            tests.test_json_columnar -v
          cargo test --manifest-path native/Cargo.toml --release --locked
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Open and verify the frozen public validation corpus
        shell: bash
        run: |
          set -euo pipefail
          python scripts/fetch-log-corpus.py \
            --config config/logtrie-json-log-validation-v1.json \
            --output corpora/logtrie-validation-v1 \
            --cache "$RUNNER_TEMP/logtrie-validation-cache" \
            --allow-blind-validation 2>&1 | \
            tee "$EVIDENCE_DIR/validation-fetch.log"
          cp \
            corpora/logtrie-validation-v1/manifest.json \
            "$EVIDENCE_DIR/validation-manifest.json"

      - name: Require a quiet host for the JLS2 first score
        shell: bash
        run: |
          set -euo pipefail
          python scripts/wait-for-quiet-host.py \
            --gates config/jls2-public-validation-gates.json \
            --consecutive 3 \
            --interval 5 \
            --timeout 180 | \
            tee "$EVIDENCE_DIR/jls2-quiet-host.log"

      - name: Run the frozen JLS2 first score
        id: jls2
        shell: bash
        run: |
          set +e
          python scripts/benchmark-jls2-public-validation.py \
            --manifest corpora/logtrie-validation-v1/manifest.json \
            --gates config/jls2-public-validation-gates.json \
            --output "$EVIDENCE_DIR/jls2-validation-result.json" \
            --repetitions 5 2>&1 | \
            tee "$EVIDENCE_DIR/jls2-validation.log"
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Require a quiet host for the fixed PBC comparison
        if: always() && steps.jls2.outputs.exit_code == '0'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/wait-for-quiet-host.py \
            --gates config/pbc-public-validation-gates.json \
            --consecutive 3 \
            --interval 5 \
            --timeout 180 | \
            tee "$EVIDENCE_DIR/pbc-quiet-host.log"

      - name: Run the frozen official PBC comparison
        if: always() && steps.jls2.outputs.exit_code == '0'
        id: pbc
        shell: bash
        run: |
          set +e
          python scripts/benchmark-pbc-competitor.py \
            --pbc-binary "$PBC_DIR/bin/pbc" \
            --pbc-repository "$PBC_DIR" \
            --manifest corpora/logtrie-validation-v1/manifest.json \
            --accepted "$EVIDENCE_DIR/jls2-validation-result.json" \
            --gates config/pbc-public-validation-gates.json \
            --output "$EVIDENCE_DIR/pbc-validation-result.json" \
            --repetitions 5 \
            --training-repetitions 2 2>&1 | \
            tee "$EVIDENCE_DIR/pbc-validation.log"
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Evaluate every frozen cross-codec gate
        if: always() && steps.jls2.outputs.exit_code == '0' && steps.pbc.outputs.exit_code == '0'
        id: evaluate
        shell: bash
        run: |
          set +e
          python scripts/evaluate-jls2-public-validation.py \
            --jls2 "$EVIDENCE_DIR/jls2-validation-result.json" \
            --pbc "$EVIDENCE_DIR/pbc-validation-result.json" \
            --gates config/jls2-public-validation-gates.json \
            --output "$EVIDENCE_DIR/public-validation-decision.json" 2>&1 | \
            tee "$EVIDENCE_DIR/public-validation-evaluation.log"
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish the bounded validation summary
        if: always()
        shell: bash
        run: |
          if [[ -f "$EVIDENCE_DIR/public-validation-decision.json" ]]; then
            python -c "import json, os; p=json.load(open(os.path.join(os.environ['EVIDENCE_DIR'], 'public-validation-decision.json'))); a=p['aggregate']; print('## JLS2 one-time public validation'); print(); print(f\"Passed: {p['passed']}\"); print(f\"Decision: {p['decision']}\"); print(f\"JLS2 bytes: {a['jls2_bytes']}\"); print(f\"Gain vs zstd-9: {a['gain_vs_zstd9_percent']:.2f}%\"); print(f\"Gain vs Brotli-11: {a['gain_vs_brotli11_percent']:.2f}%\"); print(f\"Gain vs PBC-only: {a['gain_vs_pbc_percent']:.2f}%\"); print(f\"Compression: {a['jls2_compression_mbps']:.2f} MB/s\"); print(f\"Decompression: {a['jls2_decompression_mbps']:.2f} MB/s\"); print(); [print(f\"- {r['family']}: {r['gain_vs_zstd9_percent']:.2f}% vs zstd-9, {r['gain_vs_brotli11_percent']:.2f}% vs Brotli-11, {r['gain_vs_pbc_percent']:.2f}% vs PBC-only\") for r in p['rows']]" >> "$GITHUB_STEP_SUMMARY"
          elif [[ -f "$EVIDENCE_DIR/jls2-validation-result.json" ]]; then
            python -c "import json, os; p=json.load(open(os.path.join(os.environ['EVIDENCE_DIR'], 'jls2-validation-result.json'))); print('## JLS2 one-time public validation'); print(); print('Cross-codec evaluation was not completed.'); print(f\"Completed JLS2 families: {len(p.get('rows', []))}\")" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Validation did not produce a score file." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Seal all evidence checksums
        if: always()
        shell: bash
        run: |
          if compgen -G "$EVIDENCE_DIR/*" > /dev/null; then
            (
              cd "$EVIDENCE_DIR"
              find . -type f ! -name SHA256SUMS -print0 | \
                sort -z | xargs -0 sha256sum
            ) > "$EVIDENCE_DIR/SHA256SUMS"
          fi

      - name: Upload the complete validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jls2-public-validation-${{ github.run_id }}
          path: ${{ runner.temp }}/compression-lab-validation-evidence
          if-no-files-found: warn
          retention-days: 90

      - name: Enforce the frozen first-score decision
        if: always()
        shell: bash
        run: |
          jls2_status="${{ steps.jls2.outputs.exit_code }}"
          pbc_status="${{ steps.pbc.outputs.exit_code }}"
          evaluation_status="${{ steps.evaluate.outputs.exit_code }}"
          if [[ -z "$jls2_status" || -z "$pbc_status" || -z "$evaluation_status" ]]; then
            echo "Validation did not complete every frozen stage" >&2
            exit 1
          fi
          if [[ "$jls2_status" -ne 0 ]]; then
            exit "$jls2_status"
          fi
          if [[ "$pbc_status" -ne 0 ]]; then
            exit "$pbc_status"
          fi
          exit "$evaluation_status"
