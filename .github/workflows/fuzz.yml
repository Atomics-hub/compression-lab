name: Scheduled fuzzing

on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * 1"

permissions:
  contents: read

concurrency:
  group: scheduled-frame-fuzz
  cancel-in-progress: false

jobs:
  frame-fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Run 100,000 hostile-frame mutations
        run: python scripts/fuzz_frames.py --iterations 100000 --seed 20260716
      - name: Run native release tests
        run: cargo test --manifest-path native/Cargo.toml --release --locked
