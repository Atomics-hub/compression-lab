name: JLS2 RSS arena experiment

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jls2-rss-arena-experiment-${{ github.ref }}
  cancel-in-progress: false

jobs:
  arena-matrix:
    name: Diagnostic allocator/affinity RSS matrix
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install -e .

      - name: Build release decoder
        run: cargo build --release --locked --bin clab-jls2
        working-directory: native

      - name: Ensure GNU time is available
        run: test -x /usr/bin/time || { sudo apt-get update && sudo apt-get install -y time; }

      - name: Run the RSS-instrument matrix
        run: |
          python scripts/experiment-jls2-rss-arena.py \
            --work-dir "$RUNNER_TEMP/arena-work" \
            --output "$RUNNER_TEMP/arena-report.json"
          cp "$RUNNER_TEMP/arena-report.json" arena-report.json
          python - <<'EOF'
          import json
          report = json.load(open("arena-report.json"))
          print(f"cpu_count={report['cpu_count']} glibc={report['glibc_version']}")
          for cell in report["cells"]:
              clean = cell.get("clean_peak_rss_mib")
              print(
                  f"{cell['label']:>18}"
                  f" cpus={str(cell['cpu_limit'] or 'all'):>3}"
                  f" artifact={cell['artifact']:>4}"
                  f" wait4={cell['wait4_peak_rss_mib']:>8} MiB"
                  f" clean={str(clean) + ' MiB' if clean is not None else 'n/a':>12}"
                  f" cpu={cell['cpu_seconds']}s"
              )
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: jls2-rss-arena-report-${{ github.run_id }}
          path: arena-report.json
          if-no-files-found: error
          retention-days: 30
