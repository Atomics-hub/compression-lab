name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - agent/**

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 3.12 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and test tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Compile Python sources
        run: python -m compileall -q src tests
      - name: Lint Python sources
        run: ruff check src tests scripts setup.py
      - name: Type-check public surface
        run: mypy src/compresslab/api.py src/compresslab/experimental.py src/compresslab/json_log_codec.py src/compresslab/cli.py scripts/benchmark-tbl1-public-validation.py scripts/evaluate-tbl1-public-validation.py
      - name: Check Rust formatting
        run: |
          cargo fmt --manifest-path native/Cargo.toml --all -- --check
          cargo fmt --manifest-path native-dense/Cargo.toml --all -- --check
      - name: Lint Rust library
        run: |
          cargo clippy --manifest-path native/Cargo.toml --all-targets --locked -- -D warnings
          cargo clippy --manifest-path native-dense/Cargo.toml --all-targets --locked -- -D warnings
      - name: Test Rust library (debug)
        run: |
          cargo test --manifest-path native/Cargo.toml --locked
          cargo test --manifest-path native-dense/Cargo.toml --locked
      - name: Test Rust library (release)
        run: |
          cargo test --manifest-path native/Cargo.toml --release --locked
          cargo test --manifest-path native-dense/Cargo.toml --release --locked
      - name: Test Python package
        run: python -W error::ResourceWarning -m unittest discover -s tests -v
      - name: Run hostile-frame fuzz smoke
        if: matrix.os == 'ubuntu-latest'
        run: python scripts/fuzz_frames.py --iterations 5000 --seed 20260716

  python-compatibility:
    name: Python ${{ matrix.python }} compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip && python -m pip install -e .
      - run: python -m unittest tests.test_api tests.test_adaptive tests.test_structured_text tests.test_json_log_codec -v

  package:
    name: Build and inspect distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: compression-lab-distributions
          path: dist/*
          if-no-files-found: error

  wheel-smoke:
    name: Install native wheel / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install cibuildwheel==3.4.1
      - name: Build and test one native wheel
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_ARCHS: native
          CIBW_BUILD: cp312-*
          CIBW_TEST_COMMAND: >-
            python -c "import compresslab; from compresslab import native;
            from compresslab.dense_native import dense_parallel_native_available,
            dense_plane_native_available; from compresslab.dense_matrix_transform
            import selector_compress, selector_decompress; data=b'0,1,16,4\n1,0,2,4\n'*1000;
            assert native.native_available(); assert dense_parallel_native_available();
            assert dense_plane_native_available(); assert selector_decompress(selector_compress(data))==data"
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-smoke-${{ runner.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error
